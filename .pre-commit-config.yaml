repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, master]
      - id: trailing-whitespace
        exclude: \.ambr$
      - id: end-of-file-fixer
        exclude: \.ambr$
      - id: check-added-large-files

  # Ruff for both linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Strictness is governed by [tool.mypy] in pyproject.toml (strict
        # = true, with per-module overrides relaxing pytest-style test
        # files) — passing --strict here as a CLI flag would override
        # those overrides and fail on every untyped test fixture.
        additional_dependencies:
          # The mypy hook runs in its own isolated venv; mirror the full
          # dependency set (runtime + test) so imports resolve instead of
          # flooding "Cannot find implementation or library stub" errors.
          - pydantic>=2.0.0
          - typer>=0.12.0
          - rich>=13.0.0
          - prompt_toolkit>=3.0.0
          - rapidfuzz>=3.0.0
          - tomlkit>=0.12.0
          - platformdirs>=4.0.0
          - pytest>=8.0.0
          - syrupy>=4.0.0
        args: ["--config-file", "pyproject.toml"]
