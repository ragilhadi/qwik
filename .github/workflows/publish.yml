name: Test, Build & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Same gate release.yml's Tests workflow runs on every PR — a release
    # build must not be allowed to ship something the PR gate would have
    # rejected. Cross-workflow `needs:` isn't a thing in GitHub Actions
    # (test.yml runs on push/pull_request, this runs on release/dispatch),
    # so the gate is duplicated here rather than referenced.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Type check
        run: mypy qwik

      - name: Lint
        run: ruff check qwik tests

      - name: Format check
        run: ruff format --check qwik tests

      - name: Run tests (coverage gate from pyproject enforced)
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI exchanges this short-lived OIDC token for
      # upload credentials, so no long-lived API token needs to be held in
      # repo secrets at all.
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
