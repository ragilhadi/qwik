name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Type check
        run: mypy qwik

      # One leg installs every POSIX/xonsh/nu shell the integration suite
      # targets and turns on QWIK_REQUIRE_SHELLS, so a shell silently
      # missing from this image fails the build instead of the suite
      # quietly skipping its coverage (the gap that let the fish and
      # xonsh renderers ship broken in the first place). pwsh ships
      # preinstalled on GitHub-hosted ubuntu runners; bash is native.
      # Windows CI covers cmd and pwsh natively via the platform-gated
      # tests instead, since zsh/fish/nu/xonsh aren't available there.
      - name: Install additional shells for integration tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fish zsh
          pipx install xonsh==0.24.1
          curl -sSL -o /tmp/nu.tar.gz https://github.com/nushell/nushell/releases/download/0.101.0/nu-0.101.0-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p /tmp/nu-bin
          tar -xzf /tmp/nu.tar.gz -C /tmp/nu-bin --strip-components=1
          echo "/tmp/nu-bin" >> "$GITHUB_PATH"

      - name: Run tests (coverage gate from pyproject enforced)
        run: pytest -q
        env:
          QWIK_REQUIRE_SHELLS: ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') && '1' || '' }}