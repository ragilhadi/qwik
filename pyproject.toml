[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwik"
version = "1.1.4"
description = "A Friendly CLI Alias Manager"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "qwik contributors"}
]
keywords = ["cli", "alias", "shell", "productivity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "rapidfuzz>=3.0.0",
    "pydantic>=2.0.0",
    "tomlkit>=0.12.0",
    "platformdirs>=4.0.0",
    "pre-commit>=4.6.2",
]

[project.scripts]
qwik = "qwik.cli:main_entrypoint"

[project.entry-points."qwik.shell_renderers"]
bash = "qwik.shells.bash:BashRenderer"
zsh = "qwik.shells.zsh:ZshRenderer"
fish = "qwik.shells.fish:FishRenderer"
pwsh = "qwik.shells.pwsh:PwshRenderer"
cmd = "qwik.shells.cmd:CmdRenderer"
nu = "qwik.shells.nu:NuRenderer"
xonsh = "qwik.shells.xonsh:XonshRenderer"

[project.entry-points."qwik.history_readers"]
bash = "qwik.core.history:BashHistoryReader"
zsh = "qwik.core.history:ZshHistoryReader"
fish = "qwik.core.history:FishHistoryReader"
pwsh = "qwik.core.history:PwshHistoryReader"
nu = "qwik.core.history:NuHistoryReader"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "syrupy>=4.0.0",
    "mypy==2.4.0",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["qwik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=qwik --cov-report=term-missing --cov-report=xml --cov-fail-under=85 -m 'not benchmark'"
markers = [
    "integration: end-to-end tests that spawn real shell subprocesses",
    "benchmark: performance benchmarks (run manually)",
]

[tool.coverage.run]
source = ["qwik"]
omit = ["*/tests/*"]
relative_files = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Pytest test files: the suite is enforced by pytest itself, and strict's
# untyped-def/decorator rules plus the dynamic patterns tests rely on
# (monkeypatched class methods, Optional get() chains, re-exports of
# non-public names) are noise here — not for the library code they test,
# which stays fully strict.
module = ["tests.*", "tests.*.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
no_implicit_reexport = false
warn_return_any = false
check_untyped_defs = true
# Idiomatic-in-tests patterns mypy's value checks reject:
#   attr-defined    — re-export from __main__/typer.testing internals
#   method-assign   — monkeypatching methods on classes
#   union-attr      — store.get(name).command chains in assertions
#   etc.            — parametrize lambdas, generator fixtures, tags
disable_error_code = [
    "arg-type",
    "attr-defined",
    "index",
    "list-item",
    "method-assign",
    "misc",
    "no-any-return",
    "no-untyped-call",
    "union-attr",
    "unused-ignore",
]

[[tool.mypy.overrides]]
# Where the current Click context comes from depends on the installed
# typer: some typer releases vendor click as `typer._click` (no click
# dependency), others depend on `click` directly. theme.py tries one
# import then the other, so whichever package a given environment lacks
# must resolve as Any instead of failing module resolution.
module = ["typer._click", "typer._click.*", "click", "click.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The try/except context-import shim above needs `no-redef` suppression
# in typer versions where the second import redefines a typed name, but
# in environments where BOTH imports resolve the suppression becomes
# "unused" — a version-dependent state no single flag can satisfy.
module = "qwik.ui.theme"
warn_unused_ignores = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "PLW", "RUF"]
ignore = [
    # Typer's entire CLI-declaration API is `param: T = typer.Option(...)` /
    # `typer.Argument(...)` — a function call as a default value is the
    # intended, documented way to configure a parameter, not a shared
    # mutable-default bug.
    "B008",
    # pydantic models copy `list`/`dict` field defaults per-instance, so the
    # mutable-default-shared-across-calls hazard this rule targets for plain
    # dataclasses/functions doesn't apply to `qwik.core.models`.
    "RUF012",
    # `qwik.config` intentionally caches a lazily-built singleton behind a
    # module-level global, reset only by tests; that's the pattern, not an
    # oversight.
    "PLW0603",
    # The CLI layer's `except Exception:` blocks are deliberate last-resort
    # guards (doctor checks, shell detection, best-effort cleanup) that must
    # keep running past an unexpected failure in one check rather than
    # crashing the whole command. Narrowing each one needs a case-by-case
    # behavioral review; tracked separately from this CI-hygiene pass.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
